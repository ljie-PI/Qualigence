version: v2
modules:
  - path: packages/contracts/runner-protocol/proto
lint:
  use:
    - STANDARD
  # RunnerService uses a bidirectional streaming envelope (RunnerFrame/ServerFrame)
  # shared across the single Connect RPC, which is incompatible with buf's default
  # per-RPC request/response naming rules. The envelope pattern is intentional.
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
