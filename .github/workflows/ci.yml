name: Ticket 32 Linux platform evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ticket-32-linux-platform-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record exact evidence commit before provisioning
        shell: bash
        run: |
          mkdir -p ticket-32-platform-evidence
          git rev-parse HEAD | tee ticket-32-platform-evidence/commit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm --filter @qualigence/web-playwright exec playwright install --with-deps chromium
      - name: Run restored Ticket 32 cases without quarantine markers
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm vitest run tests/component/local-launcher/start-stop.test.ts tests/component/skill-lifecycle/recording-to-replay.test.ts tests/component/web-execution/playwright-web-target.test.ts tests/contract/kms-local/skill-signing.test.ts 2>&1 | tee ticket-32-platform-evidence/vitest.txt
          if rg -n 'TODO\(Task 21\): remove this Windows quarantine' tests > ticket-32-platform-evidence/quarantine-markers.txt; then
            exit 1
          elif [ "$?" -ne 1 ]; then
            exit 1
          fi
          printf 'no quarantine markers; rg exit 1\n' >> ticket-32-platform-evidence/quarantine-markers.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ticket-32-linux-platform-evidence-${{ github.sha }}
          path: ticket-32-platform-evidence/
          if-no-files-found: error

  gate-linux:
    runs-on: ubuntu-latest
    steps:
      # v4.6.0, reviewed immutable action commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v6.1.0, reviewed immutable action commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # v4.2.3, reviewed immutable action commit.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pnpm-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Run Linux Gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-linux
          node --experimental-strip-types tests/helpers/infrastructure-preflight.ts openssl 2>&1 | tee gate-linux/preflight.txt
          { git rev-parse HEAD; node --version; corepack enable; corepack pnpm --version; openssl version; } | tee gate-linux/environment.txt
          node --version | grep -Eq '^v24\\.'
          test "$(corepack pnpm --version)" = 11.7.0
          corepack pnpm install --frozen-lockfile 2>&1 | tee gate-linux/install.txt
          corepack pnpm --filter @qualigence/web-playwright exec playwright install --with-deps chromium 2>&1 | tee gate-linux/chromium.txt
          corepack pnpm gate:fast 2>&1 | tee gate-linux/fast-command.txt
          corepack pnpm gate:linux 2>&1 | tee gate-linux/command.txt
          find gate-linux -type f -print0 | sort -z | xargs -0 sha256sum > gate-linux/sha256.txt
      # v4.6.2, reviewed immutable action commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gate-linux
          path: gate-linux/
          if-no-files-found: error

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      # v4.6.0, reviewed immutable action commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v6.1.0, reviewed immutable action commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # v4.2.3, reviewed immutable action commit.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pnpm-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Run rendered Chromium workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-e2e
          node --experimental-strip-types tests/helpers/infrastructure-preflight.ts openssl docker 2>&1 | tee browser-e2e/preflight.txt
          { git rev-parse HEAD; node --version; corepack enable; corepack pnpm --version; openssl version; docker --version; } | tee browser-e2e/environment.txt
          node --version | grep -Eq '^v24\\.'
          test "$(corepack pnpm --version)" = 11.7.0
          corepack pnpm install --frozen-lockfile 2>&1 | tee browser-e2e/install.txt
          corepack pnpm --filter @qualigence/web-playwright exec playwright install --with-deps chromium 2>&1 | tee browser-e2e/chromium.txt
          corepack pnpm vitest run tests/e2e/web-console/browser-workflow.test.ts 2>&1 | tee browser-e2e/vitest.txt
          find browser-e2e -type f -print0 | sort -z | xargs -0 sha256sum > browser-e2e/sha256.txt
      # v4.6.2, reviewed immutable action commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-e2e
          path: browser-e2e/
          if-no-files-found: error

  release-metadata:
    needs: [gate-linux, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # v4.6.0, reviewed immutable action commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify immutable mandatory Gate artifacts and write phase-1 release block metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$EXPECTED_COMMIT"
          printf '%s\n' "$commit" > release-metadata/commit.txt
          cat > release-metadata/verify-gates.mjs <<'NODE'
          import { writeFile } from "node:fs/promises";

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const commit = process.env.EXPECTED_COMMIT;
          if (!repository || !token || !commit) throw new Error("release metadata environment is incomplete");
          const response = await fetch(`https://api.github.com/repos/${repository}/actions/artifacts?per_page=100`, {
            headers: { accept: "application/vnd.github+json", authorization: `Bearer ${token}`, "x-github-api-version": "2022-11-28" },
          });
          if (!response.ok) throw new Error(`artifact inventory request failed: ${response.status}`);
          const payload = await response.json();
          const artifacts = Array.isArray(payload.artifacts) ? payload.artifacts : [];
          const required = ["gate-linux", "browser-e2e", "gate-windows-rust", "gate-self-hosted"];
          const inventory = required.map((name) => {
            const named = artifacts.filter((artifact) => artifact.name === name && artifact.expired !== true);
            const matching = named.find((artifact) => artifact.workflow_run?.head_sha === commit);
            return matching === undefined
              ? { name, status: named.length === 0 ? "GateArtifactUnavailable" : "GateArtifactCommitMismatch", observedCommits: named.map((artifact) => artifact.workflow_run?.head_sha ?? null) }
              : { name, status: "verified", artifactId: matching.id, workflowRunId: matching.workflow_run?.id ?? null, commit: matching.workflow_run?.head_sha, digest: matching.digest ?? null };
          });
          const blocked = inventory.filter((artifact) => artifact.status !== "verified" || artifact.digest === null);
          await writeFile("release-metadata/gate-artifacts.json", `${JSON.stringify({ commit, status: blocked.length === 0 ? "verified" : "gate-blocked", artifacts: inventory }, null, 2)}\n`);
          if (blocked.length !== 0) process.exitCode = 2;
          NODE
          verified=false
          for attempt in $(seq 1 20); do
            if node release-metadata/verify-gates.mjs; then verified=true; break; fi
            sleep 30
          done
          test "$verified" = true
          cat > release-metadata/release-blocked.json <<EOF
          {"status":"release-blocked","commit":"$commit","missingEvidence":["WindowsChecklistEvidenceUnavailable","RealProviderEvidenceUnavailable"],"gateArtifacts":"verified","note":"This successful report is phase-1 block evidence only. Tickets 34 and 35 must reject it for publishing or freeze."}
          EOF
          find release-metadata -type f -print0 | sort -z | xargs -0 sha256sum > release-metadata/sha256.txt
      # v4.6.2, reviewed immutable action commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error
