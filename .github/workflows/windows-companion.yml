name: Ticket 32 Windows platform evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ticket-32-windows-platform-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record exact evidence commit before provisioning
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ticket-32-platform-evidence | Out-Null
          git rev-parse HEAD | Tee-Object -FilePath ticket-32-platform-evidence/commit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: choco install ripgrep --yes --no-progress
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm --filter @qualigence/web-playwright exec playwright install chromium
      - name: Run restored Ticket 32 cases without quarantine markers
        shell: pwsh
        run: |
          corepack pnpm vitest run tests/component/local-launcher/start-stop.test.ts tests/component/skill-lifecycle/recording-to-replay.test.ts tests/component/web-execution/playwright-web-target.test.ts tests/contract/kms-local/skill-signing.test.ts 2>&1 | Tee-Object -FilePath ticket-32-platform-evidence/vitest.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rg -n 'TODO\(Task 21\): remove this Windows quarantine' tests *> ticket-32-platform-evidence/quarantine-markers.txt
          if ($LASTEXITCODE -ne 1) { exit 1 }
          Add-Content -Path ticket-32-platform-evidence/quarantine-markers.txt -Value 'no quarantine markers; rg exit 1'
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ticket-32-windows-platform-evidence-${{ github.sha }}
          path: ticket-32-platform-evidence/
          if-no-files-found: error

  gate-windows-rust:
    runs-on: windows-latest
    steps:
      # v4.6.0, reviewed immutable action commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v6.1.0, reviewed immutable action commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # v4.2.3, reviewed immutable action commit.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~\AppData\Local\pnpm\store
            ~\AppData\Local\ms-playwright
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-pnpm-cargo-playwright-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'rust-toolchain.toml') }}
      - name: Run Windows and Rust Gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force gate-windows-rust | Out-Null
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((node --version) -notmatch '^v24\.') { throw 'node version must be 24' }
          if ((corepack pnpm --version) -ne '11.7.0') { throw 'pnpm version must be 11.7.0' }
          if (Test-Path 'C:\Program Files\Git\usr\bin\openssl.exe') { $env:PATH = "C:\Program Files\Git\usr\bin;" + $env:PATH }
          node --experimental-strip-types tests/helpers/infrastructure-preflight.ts windows11 cargo openssl 2>&1 | Tee-Object gate-windows-rust/preflight.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @("commit=$(git rev-parse HEAD)", "node=$(node --version)", "pnpm=$(corepack pnpm --version)", "rust=$(rustc --version)", "openssl=$(openssl version)", "os=$([System.Environment]::OSVersion.VersionString)") | Set-Content gate-windows-rust/environment.txt
          corepack pnpm install --frozen-lockfile 2>&1 | Tee-Object gate-windows-rust/install.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt 2>&1 | Tee-Object gate-windows-rust/rustup.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm --filter @qualigence/web-playwright exec playwright install chromium 2>&1 | Tee-Object gate-windows-rust/chromium.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm gate:windows 2>&1 | Tee-Object gate-windows-rust/command.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path .gate-evidence/gate-windows-rust/accepted.json)) { throw 'GateAcceptedMarkerMissing' }
          Copy-Item -Recurse .gate-evidence/gate-windows-rust gate-windows-rust/gate-evidence
          $evidenceRoot = (Resolve-Path gate-windows-rust).Path
          Get-ChildItem gate-windows-rust -File -Recurse | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path.Substring($evidenceRoot.Length).TrimStart('\', '/').Replace('\', '/'))" } | Set-Content gate-windows-rust/sha256.txt
          node --experimental-strip-types tests/helpers/gate-evidence.ts receipt --gate gate-windows-rust --report gate-windows-rust/gate-evidence/report.json --marker gate-windows-rust/gate-evidence/accepted.json --hashes gate-windows-rust/sha256.txt --receipt gate-windows-rust/receipt.json
      # v4.6.2, reviewed immutable action commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gate-windows-rust
          path: gate-windows-rust/
          if-no-files-found: error
