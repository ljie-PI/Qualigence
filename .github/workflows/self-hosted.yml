name: Ticket 33 Self-hosted Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-self-hosted:
    runs-on: ubuntu-latest
    steps:
      # v4.6.0, reviewed immutable action commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v6.1.0, reviewed immutable action commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # v4.2.3, reviewed immutable action commit.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Run Docker-backed Self-hosted Gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-self-hosted
          node --experimental-strip-types tests/helpers/infrastructure-preflight.ts docker 2>&1 | tee gate-self-hosted/preflight.txt
          { git rev-parse HEAD; node --version; corepack enable; corepack pnpm --version; docker --version; docker compose version; } | tee gate-self-hosted/environment.txt
          node --version | grep -Eq '^v24\.'
          test "$(corepack pnpm --version)" = 11.7.0
          corepack pnpm install --frozen-lockfile 2>&1 | tee gate-self-hosted/install.txt
          corepack pnpm gate:self-hosted 2>&1 | tee gate-self-hosted/command.txt
          test -f .gate-evidence/gate-self-hosted/accepted.json
          cp -R .gate-evidence/gate-self-hosted gate-self-hosted/gate-evidence
          find gate-self-hosted -type f -print0 | sort -z | xargs -0 sha256sum > gate-self-hosted/sha256.txt
          node --experimental-strip-types tests/helpers/gate-evidence.ts receipt --gate gate-self-hosted --report gate-self-hosted/gate-evidence/report.json --marker gate-self-hosted/gate-evidence/accepted.json --hashes gate-self-hosted/sha256.txt --receipt gate-self-hosted/receipt.json
      # v4.6.2, reviewed immutable action commit.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gate-self-hosted
          path: gate-self-hosted/
          if-no-files-found: error
