[package]
name = "companion"
version = "0.0.0"
edition = "2021"
publish = false
description = "Qualigence M3 Desktop Companion: the sole broker for desktop process lifecycle, UIA capture and UIA action execution (LS-13)."

[lib]
name = "companion"
path = "src/lib.rs"

[[bin]]
name = "companion"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
signature = "2"
x509-parser = { version = "0.17", features = ["verify"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
default-features = false
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
] }

# Rust tests live outside `src/` per the repo-wide constraint: top-level
# `tests/rust/companion/*.rs`, wired here as explicit integration-test targets
# (no inline `#[cfg(test)] mod tests` in production files).
[[test]]
name = "companion_approval_state"
path = "../../tests/rust/companion/approval_state.rs"

[[test]]
name = "companion_emergency_stop"
path = "../../tests/rust/companion/emergency_stop.rs"

[[test]]
name = "companion_ipc_acl"
path = "../../tests/rust/companion/ipc_acl.rs"

[[test]]
name = "companion_ipc_limits"
path = "../../tests/rust/companion/ipc_limits.rs"

[[test]]
name = "companion_permit_binding"
path = "../../tests/rust/companion/permit_binding.rs"

[[test]]
name = "companion_handshake"
path = "../../tests/rust/companion/handshake.rs"

[[test]]
name = "companion_windows_named_pipe"
path = "../../tests/rust/companion/windows_named_pipe.rs"

[[test]]
name = "companion_uia_worker_protocol"
path = "../../tests/rust/companion/uia_worker_protocol.rs"

[[test]]
name = "companion_uia_action_timeout"
path = "../../tests/rust/companion/uia_action_timeout.rs"

[[test]]
name = "companion_job_object_lifecycle"
path = "../../tests/rust/companion/job_object_lifecycle.rs"

[[test]]
name = "companion_reference_app_scenario"
path = "../../tests/rust/companion/reference_app_scenario.rs"
